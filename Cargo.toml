[package]
name = "siren"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Cloudflare Worker Core
worker = "0.8.0"
worker-macros = "0.8.0"
wasm-bindgen = "=0.2.118"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1.7"

# Serialization & Logic
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# PENTING: Fitur "serde" ditambahkan di sini
uuid = { version = "1.8.0", features = ["v4", "js", "serde"] } 
getrandom = { version = "0.2", features = ["js"] }
regex = "1.11.1"
once_cell = "1.21.3"

# Networking & Async Utilities
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1.28", default-features = false, features = ["io-util"] }
futures-util = "0.3.28"
bytes = "1.4.0"

# Data & Security Utils
base64 = "0.22"
aes-gcm = "0.10"
aes = "0.8"
sha2 = "0.10"
md-5 = "0.10"
anyhow = "1.0.86"
pretty-bytes = "0.2.2"
pin-project-lite = "0.2"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
